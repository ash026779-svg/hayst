<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff0f5">
<title>our little memories ♡</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: "Trebuchet MS", sans-serif;
  background: #fff0f5;
  color: #773e57;
}

.screen {
  width: 100%;
  height: 100%;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  text-align: center;
}

#lock {
  background: radial-gradient(circle at top, #ffe0eb, transparent 65%), #fff0f5;
}

.ribbon { font-size: 48px; margin-bottom: 8px; }

h1 {
  font-size: 27px;
  margin: 8px 0;
  color: #a64d73;
}

.subtitle {
  font-size: 14px;
  color: #a56b83;
  margin: 5px 0 24px;
}

#code {
  width: 160px;
  padding: 14px;
  border: 2px solid #edb4cc;
  border-radius: 15px;
  background: #fffafd;
  color: #773e57;
  font-size: 27px;
  text-align: center;
  letter-spacing: 12px;
  outline: none;
}

#code:focus {
  border-color: #d879a0;
  box-shadow: 0 0 0 4px #f8d4e3;
}

#unlock {
  border: none;
  border-radius: 14px;
  background: #e99bb9;
  color: white;
  padding: 13px 22px;
  margin-top: 15px;
  font-size: 15px;
  cursor: pointer;
}

#message {
  min-height: 20px;
  font-size: 13px;
  color: #b34e78;
  margin: 12px 0 0;
}

.hints {
  margin-top: 15px;
  padding: 15px 17px;
  max-width: 340px;
  width: 100%;
  background: #ffffffa8;
  border: 1px solid #f4c8d9;
  border-radius: 16px;
  color: #8d526b;
  font-size: 13px;
  line-height: 1.7;
}

.hints p { margin: 4px 0; }

#gallery {
  display: none;
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  padding: 0;
  background: #241820;
  color: white;
  overflow: hidden;
}

#photo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  opacity: 1;
  transition: opacity .25s ease;
  user-select: none;
  -webkit-user-drag: none;
}

#photo.fade { opacity: 0; }

#loading {
  position: absolute;
  z-index: 1;
  color: #ffe8f1;
  padding: 24px;
  font-size: 14px;
}

#prev, #next {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 30%;
  margin: 0;
  padding: 0;
  border: none;
  border-radius: 0;
  background: transparent;
  z-index: 2;
}

#prev { left: 0; }
#next { right: 0; }

#caption {
  position: absolute;
  z-index: 3;
  top: 18px;
  left: 0;
  right: 0;
  color: #ffe8f1;
  font-size: 13px;
  text-shadow: 0 1px 6px black;
  pointer-events: none;
}

#counter {
  position: absolute;
  z-index: 3;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  padding: 8px 14px;
  border-radius: 20px;
  background: #241820aa;
  color: #ffe8f1;
  font-size: 13px;
  pointer-events: none;
}
</style>
</head>

<body>

<!-- PASSWORD SCREEN -->

<section class="screen" id="lock">
  <div class="ribbon">🎀</div>

  <h1>enter our secret code</h1>

  <p class="subtitle">
    Guess tuba!
  </p>

  <form id="codeForm">
    <input
      id="code"
      type="password"
      inputmode="numeric"
      pattern="[0-9]{3}"
      maxlength="3"
      placeholder="•••"
      aria-label="Enter three-digit code"
      autocomplete="off"
      required
    >
    <br>

    <button id="unlock" type="submit">
      unlock our memories ♡
    </button>
  </form>

  <p id="message" aria-live="polite"></p>

  <div class="hints">
    <p>Hint: Unsay oras ka ninglugwa sa tiyan sa penguin?</p>
    <p>Another hint: Gi mention ni penguin gc</p>
  </div>
</section>


<!-- PHOTO SLIDESHOW -->

<section class="screen" id="gallery">
  <div id="loading">loading our memories ♡</div>

  <img id="photo" class="fade" alt="A memory together">

  <div id="caption">our little memories ♡</div>

  <button id="prev" aria-label="Previous photo"></button>
  <button id="next" aria-label="Next photo"></button>

  <div id="counter"></div>

  <div id="ending" style="display:none; position:absolute; inset:0; z-index:5; background:#fff0f5; color:#773e57; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center;">
    <div style="font-size:48px; margin-bottom:12px;">🎀</div>
    <h1 style="color:#a64d73;">Oh balik napud sa main page tuba!</h1>
    <button id="backHome" style="border:none; border-radius:14px; background:#e99bb9; color:white; padding:13px 22px; margin-top:15px; font-size:15px; cursor:pointer;">Balik sa main page ♡</button>
  </div>
</section>


<script>
const SECRET_CODE = "449";

// YOUR FIVE UPLOADED PHOTOS
const photos = [
  "1791609919259.jpg",
  "1791609922880.jpg",
  "1791609949903.jpg",
  "1791610104662.jpg",
  "1791610110736.jpg"
];

const lock = document.getElementById("lock");
const gallery = document.getElementById("gallery");
const codeInput = document.getElementById("code");
const message = document.getElementById("message");
const photo = document.getElementById("photo");
const loading = document.getElementById("loading");
const counter = document.getElementById("counter");

let current = 0;
let startX = 0;
let startY = 0;
let unlocked = false;

document.getElementById("codeForm").addEventListener("submit", event => {
  event.preventDefault();

  if (codeInput.value !== SECRET_CODE) {
    message.textContent = "wrong code! try again ♡";
    codeInput.value = "";
    codeInput.focus();
    return;
  }

  unlocked = true;
  lock.style.display = "none";
  gallery.style.display = "flex";
  showPhoto(0);
});

function showPhoto(index) {
  current = (index + photos.length) % photos.length;

  photo.classList.add("fade");
  loading.style.display = "block";
  loading.textContent = "loading our memories ♡";

  const nextImage = new Image();

  nextImage.onload = () => {
    photo.src = nextImage.src;
    photo.classList.remove("fade");
    loading.style.display = "none";
    counter.textContent = `${current + 1} / ${photos.length}`;
  };

  nextImage.onerror = () => {
    loading.style.display = "block";
    loading.textContent =
      "Photo not found. Check the uploaded filename or folder.";
    counter.textContent = "";
  };

  nextImage.src = photos[current];
}

function nextPhoto() {
  if (current === photos.length - 1) {
    document.getElementById("ending").style.display = "flex";
    photo.style.display = "none";
    loading.style.display = "none";
    document.getElementById("prev").style.display = "none";
    document.getElementById("next").style.display = "none";
    document.getElementById("caption").style.display = "none";
    counter.style.display = "none";
    return;
  }
  showPhoto(current + 1);
}

document.getElementById("backHome").addEventListener("click", () => {
  document.getElementById("ending").style.display = "none";
  photo.style.display = "block";
  document.getElementById("prev").style.display = "block";
  document.getElementById("next").style.display = "block";
  document.getElementById("caption").style.display = "block";
  counter.style.display = "block";
  gallery.style.display = "none";
  lock.style.display = "flex";
  codeInput.value = "";
  message.textContent = "";
  current = 0;
  unlocked = false;
});

function previousPhoto() {
  if (current === 0) return;
  showPhoto(current - 1);
}

document.getElementById("prev").addEventListener("click", previousPhoto);
document.getElementById("next").addEventListener("click", nextPhoto);

document.addEventListener("keydown", event => {
  if (!unlocked) return;
  if (event.key === "ArrowRight") nextPhoto();
  if (event.key === "ArrowLeft") previousPhoto();
});

document.addEventListener("touchstart", event => {
  startX = event.changedTouches[0].clientX;
  startY = event.changedTouches[0].clientY;
}, { passive: true });

document.addEventListener("touchend", event => {
  if (!unlocked) return;

  const dx = event.changedTouches[0].clientX - startX;
  const dy = event.changedTouches[0].clientY - startY;

  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
    if (dx < 0) nextPhoto();
    else previousPhoto();
  }
}, { passive: true });
</script>

</body>
</html>
